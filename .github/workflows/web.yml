name: KMP Web Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew wasmJsTest

      - name: Build the Production Web App
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-test-report
          path: "**/build/reports/tests/**"
          retention-days: 7

      # To try it: unzip, run python3 -m http.server inside the folder, then open localhost:8000
      - name: Upload the Web App for Testing
        uses: actions/upload-artifact@v6
        with:
          name: nimbat-web-app
          path: webApp/build/dist/wasmJs/productionExecutable
          retention-days: 7
