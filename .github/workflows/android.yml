name: KMP Android Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

# A new push to the same branch makes the older run pointless
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testAndroidHostTest

      - name: Compile and Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-report
          path: "**/build/reports/tests/**"
          retention-days: 7

      - name: Upload APK for Testing
        uses: actions/upload-artifact@v6
        with:
          name: nimbat-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
