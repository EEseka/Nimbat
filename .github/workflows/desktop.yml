name: KMP Desktop Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew jvmTest

      - name: Compile the Desktop App
        run: ./gradlew :desktopApp:assemble

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-report
          path: "**/build/reports/tests/**"
          retention-days: 7
